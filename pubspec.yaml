name: mindload
description: "سیستم مدیریت بار ذهنی - یک مغز خارجی آرام"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  provider: ^6.1.2

  # Database
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3

  # Persian / Jalali calendar
  shamsi_date: ^1.1.1
  persian_number_utility: ^1.2.1

  # Secure storage for API key
  flutter_secure_storage: ^9.2.2

  # Networking (AI + Whisper)
  http: ^1.2.1

  # Audio recording for voice notes
  record: ^5.1.2
  audioplayers: ^6.0.0

  # Image / file picking
  image_picker: ^1.1.2
  file_picker: ^8.0.6

  # Local notifications
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

  # UI helpers
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10
  uuid: ^4.4.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
